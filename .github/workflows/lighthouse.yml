name: Lighthouse CI

# Audits the PRODUCTION build (npm run build → next start) on every PR to main,
# and on main itself to track the baseline over time. Full reports are uploaded
# to temporary public storage (links appear in the job log) — no secrets needed.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse audit (production build)
    runs-on: ubuntu-latest

    # Build-time values only — no real secrets.
    # - NEXT_PUBLIC_SITE_URL is the production origin so canonical/OG/JSON-LD
    #   URLs are audited as they ship (the pages are still SERVED at localhost).
    # - mongoose.ts throws at module load if MONGODB_URI is unset, so a
    #   placeholder is required for `next build`. The unreachable 127.0.0.1 host
    #   costs one 10s server-selection timeout, then mongoose.ts fail-fast-caches
    #   the failure and the audited public pages fall back to config data
    #   immediately — no live DB needed.
    # - RESEND_API_KEY / AUTH_SECRET are placeholders; nothing is sent or
    #   authenticated during a Lighthouse run.
    env:
      NEXT_PUBLIC_SITE_URL: "https://s-almonte.vercel.app"
      NEXT_PUBLIC_GITHUB_URL: "https://github.com/SauelAlmonte"
      NEXT_PUBLIC_LINKEDIN_URL: "https://linkedin.com/in/sauel-almonte"
      AUTH_URL: "https://s-almonte.vercel.app"
      AUTH_SECRET: "lighthouse-ci-build-placeholder-not-a-secret"
      MONGODB_URI: "mongodb://127.0.0.1:27017/lighthouse-ci-placeholder"
      RESEND_API_KEY: "re_lighthouse_ci_placeholder"

    steps:
      # Actions pinned to immutable commit SHAs (supply-chain hardening).
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pin a major version so setup-node does not need to resolve the
          # floating lts/* alias from the GitHub-hosted release manifest.
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      # Official GoogleChrome Lighthouse CI, installed globally in the ephemeral
      # runner — NOT a project devDependency, so the repo stays at 0 audit
      # findings. Reads ./lighthouserc.json (collect + assert + upload).
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --config=./lighthouserc.json
